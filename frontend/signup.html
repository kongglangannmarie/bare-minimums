<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Thai Cafe Inventory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="signup-container">
    <h1>Create Your Account</h1>
    
    <div id="alert" class="alert"></div>

    <form onsubmit="handleSignup(event)">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required>
      </div>

      <div class="form-group">
        <label for="business_name">Business Name</label>
        <input type="text" id="business_name" name="business_name" placeholder="e.g., Thai Cafe on Wheels" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" required>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" minlength="8" required>
      </div>

      <button type="submit" class="signup-button" id="signup-btn">Sign Up</button>
    </form>

    <div class="login-link">
      Already have an account? <a href="index.html">Login here</a>
    </div>
  </div>

  <script src="signup.js"></script>
</body>
</html>
